name: build

# Сборка Capsul Box: APK для планшета и агент для Windows. Готовые файлы — в артефактах запуска (Actions → запуск → Artifacts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: APK для планшета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Проверка API Android, тесты и сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug testDebugUnitTest --no-daemon --console=plain
      - name: Имя файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "CapsulBox-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsulbox-apk
          path: CapsulBox-*.apk

  agent:
    name: Агент для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Тесты агента
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo
      - name: Сборка агента (один exe, .NET внутри)
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o out --nologo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsulbox-agent-win-x64
          path: out/
